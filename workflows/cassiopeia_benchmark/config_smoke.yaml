# A small end-to-end check of the workflow (minutes, not hours): layered on config.yaml with
#   snakemake --cores 8 --resources gpu=1 --configfile config.yaml config_smoke.yaml
out: results_smoke
seeds: [1]
base:
  n_cells: 2000
study_set: smoke
studies_smoke:
  heritable:
    vary: {sigma_tree: [0.5]}
    baselines: [c2l, tangram, exact_ot]
  migration:
    vary: {migrate: [0.5]}
    baselines: [exact_ot]
  tree_source:
    vary: {tree: ["reconstructed"]}
    baselines: []
example: {study: heritable, value: 0.5, seed: 1}
c2l_epochs: 500
tangram_epochs: 200
