# The target scenario (Pedro, 2026-11-02: "simulating data where clones are weakly distinguishable from gene expression but that occupy clear
# spatial locations"): tumour cells placed as nested territories along the tree (simulate.py, spatial: territories), no migration, 4-5
# clones (weak selection, clones cut at 6 lineages), clone expression from weak to very weak; 2,000 genes.
out: results_territories
base:
  spatial: territories
  territory_jitter: 1.0
  migrate: 0.0
  fitness_sd: 0.1
  clone_founders: 6           # 4-5 clones (Pedro, 2026-11-02: "use something like 4 or 5"; the number of clones is to be varied later)
  clone_min: 0.03
  genes: 2000                 # (Pedro, 2026-11-02: "Focus on simulating data with 2k genes"; depth unchanged)
study_set: territories
studies_territories:
  target:
    vary: {sigma_tree: [0.03, 0.06, 0.1]}
    baselines: [tangram, scdot, exact_ot]
example: {study: target, value: 0.06, seed: 1}
