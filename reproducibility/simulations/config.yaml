# The simulation benchmark of the paper (Figs. 2, S1, S2, S4 and S5). Every scenario (a world in the code) is the base world with one parameter changed.

python:                       # the Python of each environment (see ../README.md)
  spotr: python               # benchmark_env: SpOTr, DestVI, Tangram, scDOT, POT, scCube
  cassiopeia: python          # cassiopeia: the lineages
out: results                  # relative to this folder
seeds: [1, 2]                 # the seeds of the benchmark
tuning_seed: 3                # the seed of the base world on which we chose the settings of SpOTr (not scored)

base:
  # lineage (Cassiopeia)
  n_cells: 12000              # tumor cells, the leaves of the tree
  fitness_rate: 0.2           # rate per division of the fitness changes of BirthDeathFitnessSimulator,
  fitness_sd: 0.1             # each by Normal(0, fitness_sd)
  death_scale: 5.0            # death waiting time ~ Exponential(death_scale)
  cassettes: 13               # cassettes x sites of Cas9LineageTracingDataSimulator,
  sites: 3
  barcode_saturation: 0.5     # with this expected fraction of the sites edited at the leaves
  n_clones: 5                 # the clones: the clades at the earliest time the tree has n_clones clades with at least clone_min of the cells
  clone_min: 0.03
  migrate: 0.0                # fraction of the clones dispersed over the section
  # tissue (the tumor microenvironment layout of scCube)
  nests: 9                    # oval tumor nests
  nest_purity: 0.9            # fraction of tumor cells in a nest
  aggregates: 3               # aggregates of the second non-tumor type in the stroma
  vessels: 0.15               # fraction of the third non-tumor type in the stroma
  cell_spacing: 5.0           # um between neighboring cells
  territory_jitter: 1.0       # sd (radians) of the turn of each territory cut away from the principal axis
  # expression
  genes: 2000
  programs: 5
  sigma_tree: 0.06            # strength of the heritable programs
  sigma_space: 0.1            # strength of the positional programs
  length_scale: 0.25          # of the positional programs, as a fraction of the diameter of the section
  library: 1000               # expected library size of each cell
  # measurement
  spot_diameter: 55.0         # um; Visium spots
  spot_spacing: 100.0         # um, on a hexagonal lattice
  capture: 0.25               # fraction of the dissociated half that is sequenced
  traced: 0.7                 # fraction of the sequenced tumor cells whose lineage is read

studies:                      # Fig. 2D-F
  heritable:
    vary: {sigma_tree: [0.03, 0.06, 0.1, 0.3]}
  migration:
    vary: {migrate: [0.0, 0.2, 0.4]}
  clones:
    vary: {n_clones: [3, 5, 10]}
weights:                      # Fig. S5, the scenarios of the migration study with dispersed clones, also with heritable programs of strength 0.3
  migrate: [0.2, 0.4]
  sigma_tree: [0.06, 0.3]

methods: [c2l, destvi, tangram, scdot, exact_ot, fgw]
spotr: {alpha: 0.2, beta: 0.5}
alpha_grid: [0.0, 0.1, 0.2, 0.4, 0.95]            # Fig. S4, on the example scenario
tuning: {alpha: [0.0, 0.1, 0.2, 0.3, 0.4], beta: [0.25, 0.5, 0.75]}
example: {sigma_tree: 0.06, seed: 1}             # the example scenario of Figs. 2A-C, S2 and S4, which is the base world
c2l_epochs: 30000
tangram_epochs: 1000
