name: release

# Publishes to PyPI when a version tag is pushed on main, as in scDEF:
#
#   git fetch origin && git tag v0.1.0 origin/main && git push origin v0.1.0
#
# The tag must be the version in pyproject.toml and must be on main.
# Publishing uses PyPI's trusted publishing (OIDC), so there is no API token in the repository.
# The publisher on PyPI: project phylospatial-spotr, owner pedrofale, repository SpOTr (as GitHub spells it; the token carries
# that spelling), workflow release.yml, environment blank.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: Check the tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refuse a tag that is not the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$version" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME is not the version in pyproject.toml ($version)"; exit 1; }
      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }

  test:
    name: Test (Python ${{ matrix.python }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest tests -q

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # trusted publishing
      contents: read      # a job-level block zeroes every scope not listed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
