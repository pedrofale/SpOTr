# Builds the package, tests the built wheel and uploads it with PyPI's trusted publishing, so no token is stored anywhere.
# A published GitHub release uploads to PyPI; running this workflow by hand (Actions > publish > Run workflow) uploads to TestPyPI.
# Before the first upload, register this workflow as a pending publisher on PyPI and on TestPyPI (Account settings > Publishing):
#   project clonespotr, owner pedrofale, repository spotr, workflow publish.yml, environment pypi (on TestPyPI: testpypi).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The release tag is the version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "release tag $GITHUB_REF_NAME, pyproject.toml version $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The built wheel passes the tests
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl pytest
          "$RUNNER_TEMP/wheel/bin/python" -m pytest tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
